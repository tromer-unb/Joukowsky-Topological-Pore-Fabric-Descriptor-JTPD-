name: Reproducibility

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile jtpd_analysis.py rock_joukowsky.py
      - name: Run reference analysis
        run: python jtpd_analysis.py
      - name: Verify outputs
        run: |
          test -s results/jtpd_summary.csv
          test -s results/jtpd_results.json
          test -s results/scale_sensitivity.csv
          test -s figures/figure2_fields_topology.png
